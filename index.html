<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0E20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Bolso</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@500;600;700&display=swap">
<style>
/* Layout: app shell escuro — glow roxo no topo, barra de abas fixa, cartões sobre navy profundo */
:root{
  color-scheme:dark;
  --bg:#0A0E20;            /* fundo navy profundo */
  --surface:#131B38;       /* cartão */
  --surface-2:#1A2450;     /* chip / campo */
  --line:#273263;          /* bordas */
  --ink:#EAEDFB;           /* texto principal */
  --ink-2:#A6B0DC;         /* texto secundário */
  --ink-3:#6F7BAE;         /* legenda pequena */
  --roxo:#8B7CF8;          /* acento da marca */
  --roxo-ink:#B6ACFF;      /* roxo legível em texto */
  --azul:#4E8CFF;          /* acento 2 / barras de categoria */
  --pos:#54DCA4;           /* texto positivo */
  --neg:#FF9A9A;           /* texto negativo */
  --warn:#F2C266;          /* pendente */
  --viz-verde:#199E70;     /* série Recebido (validada) */
  --viz-roxo:#9085E9;      /* série Guardado (validada) */
  --viz-verm:#E66767;      /* série Gasto (validada) */
  --f-display:"Bricolage Grotesque","Archivo",system-ui,sans-serif;
  --f-body:"Archivo",system-ui,-apple-system,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
*{box-sizing:border-box}
html{height:100%}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-inline:16px;padding-block:0 110px;
  min-height:100%;
}
body::before{
  content:"";position:fixed;inset:0 0 auto 0;height:380px;pointer-events:none;z-index:0;
  background:
    radial-gradient(520px 260px at 18% -40px, rgba(139,124,248,.28), transparent 70%),
    radial-gradient(640px 300px at 85% -80px, rgba(78,140,255,.18), transparent 70%);
}
.wrap{max-width:980px;margin:0 auto;position:relative;z-index:1}
a{color:var(--roxo-ink)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--roxo-ink);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- topo ---------- */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;padding-block:22px 10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:clamp(21px,4.6vw,27px);letter-spacing:.2px;line-height:1.05}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:11px;letter-spacing:.18em;color:var(--roxo-ink);text-transform:uppercase;margin-top:3px}
.mesnav{margin-left:auto;display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.mesnav button{width:34px;height:34px;border-radius:999px;font-size:17px;color:var(--ink-2);display:grid;place-items:center}
.mesnav button:hover{background:var(--surface-2);color:var(--ink)}
.mesnav .meslabel{min-width:150px;text-align:center;font-weight:600;text-transform:capitalize}
.mesnav .hoje{width:auto;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--roxo-ink);padding:0 10px}
.mesnav .sep{width:1px;height:20px;background:var(--line);margin:0 2px;flex:0 0 auto}
#lock,#auth{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;padding:24px}
#lock[hidden],#auth[hidden]{display:none!important}
#lock .box,#auth .box{width:min(320px,100%);text-align:center}
#lock .lbrand,#auth .lbrand{font-family:var(--f-display);font-weight:800;font-size:28px}
#lock .lsub,#auth .lsub{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--roxo-ink);text-transform:uppercase;margin-top:4px}
#lock input,#auth input{text-align:center;font-size:22px;letter-spacing:.3em;font-family:var(--f-num);width:100%;margin-top:22px}
#lock .err,#auth .err{color:var(--neg);font-size:13px;min-height:18px;margin-top:8px}
#lock .btn,#auth .btn{width:100%;margin-top:4px}
#lock .forgot,#auth .forgot{margin-top:16px;font-size:12px;color:var(--ink-3)}
#auth input{text-align:left;letter-spacing:normal;font-size:15px;font-family:var(--f-body)}
#auth input+input{margin-top:10px}
#auth .btnrow{display:flex;gap:8px;margin-top:10px}
#auth .btnrow .btn{flex:1}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  padding:10px 2px;margin-inline:-2px;background:linear-gradient(var(--bg) 78%,transparent);backdrop-filter:blur(6px)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-weight:700;font-size:12.5px;letter-spacing:.09em;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--roxo);border-color:var(--roxo);color:#0C0A24}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:linear-gradient(90deg,rgba(139,124,248,.16),rgba(78,140,255,.10));
  border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin:10px 0 2px;font-size:13.5px;color:var(--ink-2)}
.banner b{color:var(--ink)}
.banner b.warntx{color:var(--warn)}.banner b.neg{color:var(--neg)}.banner b.pos{color:var(--pos)}
.banner .act{margin-left:auto;font-weight:700;font-size:12px;letter-spacing:.06em;color:var(--roxo-ink)}

/* ---------- cartões ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;min-width:0}
.card h2{margin:0 0 4px;font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.04em}
.card .sub{color:var(--ink-3);font-size:12.5px;margin:0 0 12px}
.cardhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cardhead .tot{margin-left:auto;color:var(--ink-2);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}

/* tiles do resumo */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.tile .lbl{font-size:10.5px;font-weight:700;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase}
.tile .val{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:clamp(19px,4.8vw,24px);margin-top:6px;overflow-wrap:anywhere}
.tile .sm{font-size:12px;color:var(--ink-3);margin-top:4px}
.tile.destaque{border-color:rgba(139,124,248,.55);background:linear-gradient(160deg,rgba(139,124,248,.14),var(--surface) 55%)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warntx{color:var(--warn)}

/* linhas de lista */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-top:1px solid var(--line);min-width:0}
.rows .row:first-child{border-top:none}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .d{font-size:12px;color:var(--ink-3);margin-top:1px}
.row .valcol{display:flex;align-items:center;justify-content:flex-end;gap:6px;flex:0 0 auto}
.chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--ink-2);
  background:var(--surface-2);border-radius:999px;padding:2px 8px;vertical-align:1px}
.chip.ex{color:#0C0A24;background:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;border-radius:999px;padding:7px 12px;border:1px solid transparent}
.pill.ok{color:var(--pos);background:rgba(25,158,112,.14);border-color:rgba(25,158,112,.4)}
.pill.pend{color:var(--warn);background:rgba(242,194,102,.10);border-color:rgba(242,194,102,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:12.5px;letter-spacing:.05em;
  border-radius:10px;padding:9px 14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.btn:hover{border-color:var(--roxo)}
.btn.primary{background:var(--roxo);border-color:var(--roxo);color:#0C0A24}
.btn.ghost{background:none;border-style:dashed;color:var(--ink-2);width:100%;margin-top:10px}
.btn.mini{padding:6px 10px;font-size:11.5px;border-radius:8px}
.btn.danger{color:var(--neg);border-color:rgba(230,103,103,.5)}
.iconb{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);border:1px solid transparent;flex:0 0 auto}
.iconb:hover{border-color:var(--line);color:var(--ink)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--ink-3);font-size:13.5px;margin-top:6px}
.empty b{color:var(--ink-2)}

/* quick add */
.qa{display:grid;grid-template-columns:130px 1fr;gap:8px}
.qa .full{grid-column:1/-1}
.qa input,.qa select{width:100%}
input,select{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);
  font:inherit;padding:10px 12px;min-width:0}
input::placeholder{color:var(--ink-3)}
input:focus,select:focus{outline:none;border-color:var(--roxo)}
label.fl{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase;margin:0 0 5px}

/* ---------- gráficos ---------- */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:2px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.chart-scroll{overflow-x:auto;min-width:0}
.gchart{min-width:330px;padding-top:18px}
.plot{position:relative;height:150px;border-bottom:1px solid var(--line)}
.gl{position:absolute;left:0;right:0;border-top:1px dashed rgba(111,123,174,.35)}
.gl span{position:absolute;right:0;top:-16px;font-size:10.5px;color:var(--ink-3);font-family:var(--f-num);background:var(--surface);padding:0 4px;border-radius:4px}
.groups{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-around;gap:8px;padding:0 4px}
.group{display:flex;align-items:flex-end;gap:2px;height:100%}
.bar{width:13px;border-radius:4px 4px 0 0;min-height:2px}
.bar.v1{background:var(--viz-verde)}.bar.v2{background:var(--viz-roxo)}.bar.v3{background:var(--viz-verm)}
.xlabels{display:flex;justify-content:space-around;gap:8px;padding:6px 4px 0;font-size:11px;color:var(--ink-3);text-transform:lowercase}
.hbars{display:flex;flex-direction:column;gap:9px;margin-top:8px}
.hb{display:grid;grid-template-columns:minmax(86px,118px) 1fr auto;align-items:center;gap:10px;min-width:0}
.hb .l{font-size:12.5px;color:var(--ink-2);overflow-wrap:anywhere}
.hb .track{height:14px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.hb .fill{height:100%;border-radius:5px 0 0 5px;background:var(--azul);min-width:2px}
.hb .v{font-size:12px;color:var(--ink-2);font-family:var(--f-num);font-variant-numeric:tabular-nums}
/* teto por categoria: a barra muda de cor conforme enche */
.hbars.teto{gap:4px}
.hbars.teto .hb{margin-top:8px}
.hbars.teto .fill.pos{background:var(--viz-verde)}
.hbars.teto .fill.warntx{background:var(--warn)}
.hbars.teto .fill.neg{background:var(--viz-verm)}
.hbars.teto .v.pos{color:var(--pos)}.hbars.teto .v.warntx{color:var(--warn)}.hbars.teto .v.neg{color:var(--neg)}
.tetod{font-size:11.5px;color:var(--ink-3);padding-left:calc(min(118px,30%) + 10px)}
/* barra de progresso das metas */
.track.meta{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:7px 0 5px}
.track.meta .fill{height:100%;border-radius:999px;background:var(--roxo)}
.track.meta .fill.pos{background:var(--viz-verde)}
/* cartão de contas vencendo */
.card.metacorr{border-color:rgba(139,124,248,.55);background:linear-gradient(160deg,rgba(139,124,248,.14),var(--surface) 60%)}
.saude{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 14px;margin-top:10px}
.saude>div{display:grid;grid-template-columns:1fr auto;gap:0 8px;font-size:12.5px}
.saude .sn{color:var(--ink-2);font-weight:600}.saude .st{grid-column:1/-1;color:var(--ink-3);font-size:11.5px}
.iconb.comfoto{color:var(--pos)}
.cal{margin-top:4px}
.calh,.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calh span{text-align:center;font-size:10.5px;font-weight:700;color:var(--ink-3);letter-spacing:.1em;padding:2px 0}
.cd{min-height:58px;border-radius:9px;background:var(--surface-2);border:1px solid transparent;display:flex;flex-direction:column;align-items:flex-start;
  padding:4px 5px;gap:1px;font-size:11px;color:var(--ink-2);overflow:hidden;text-align:left}
.cd b{font-size:12px;color:var(--ink)}
.cd.vazio{background:none}
.cd .pin,.cd .pout{font-style:normal;font-family:var(--f-num);font-size:9.5px;line-height:1.2;white-space:nowrap}
.cd .pin{color:var(--pos)}.cd .pout{color:var(--neg)}
.cd.hoje{border-color:var(--roxo)}
.cd.sel{background:rgba(139,124,248,.28);border-color:var(--roxo)}
.cd.aperto{box-shadow:inset 0 -3px 0 var(--warn)}
.cd.atraso{box-shadow:inset 0 -3px 0 var(--viz-verm)}
.plano{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
#qa-mic.ouvindo{border-color:var(--neg);color:var(--neg);animation:pulsa 1s infinite}
@keyframes pulsa{50%{opacity:.55}}
.card.alerta{border-color:rgba(242,194,102,.55);background:linear-gradient(160deg,rgba(242,194,102,.12),var(--surface) 60%)}
.card.alerta.ruim{border-color:rgba(230,103,103,.6);background:linear-gradient(160deg,rgba(230,103,103,.14),var(--surface) 60%)}

/* ---------- dialog ---------- */
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;
  width:min(440px,calc(100vw - 32px));padding:0;margin:auto}
dialog::backdrop{background:rgba(5,7,18,.72);backdrop-filter:blur(3px)}
.f{padding:18px}
.f h3{margin:0;font-family:var(--f-display);font-size:17px}
.f .fsub{color:var(--ink-3);font-size:12.5px;margin:3px 0 0}
.f .fields{display:grid;gap:12px;margin-top:16px}
.f .hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.f .err{font-size:12px;color:var(--neg);margin-top:4px}
.f .foot{display:flex;gap:8px;align-items:center;margin-top:18px}
.f .foot .spacer{flex:1}
.checkrow{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--ink-2)}
.checkrow input{width:17px;height:17px;accent-color:var(--roxo)}

/* termômetro do ano */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.tmes{border:1px solid var(--line);border-radius:10px;padding:9px 4px;display:grid;gap:3px;justify-items:center;background:var(--surface-2);cursor:pointer}
.tmes .tm{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.tmes .tp{font-size:13.5px;font-weight:600;color:var(--ink-3)}
.tmes.t-ok{background:rgba(25,158,112,.13);border-color:rgba(25,158,112,.45)}
.tmes.t-ok .tp{color:var(--pos)}
.tmes.t-meio{background:rgba(242,194,102,.10);border-color:rgba(242,194,102,.45)}
.tmes.t-meio .tp{color:var(--warn)}
.tmes.t-alto{background:rgba(230,103,103,.13);border-color:rgba(230,103,103,.5)}
.tmes.t-alto .tp{color:var(--neg)}
.tmes.sel{outline:2px solid var(--roxo);outline-offset:1px}

/* botão flutuante de gasto */
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--roxo);color:#0C0A24;font-weight:800;font-size:14px;letter-spacing:.06em;
  border-radius:999px;padding:15px 20px;border:none;box-shadow:0 10px 26px rgba(8,6,36,.6)}
.fab:hover{filter:brightness(1.07)}
.fab:active{transform:scale(.97)}

/* tooltip + toast */
#tip{position:fixed;z-index:90;background:#060918;border:1px solid var(--line);color:var(--ink);
  font-size:12px;font-family:var(--f-num);padding:7px 10px;border-radius:9px;pointer-events:none;display:none;max-width:240px}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);
  z-index:95;background:#060918;border:1px solid var(--roxo);color:var(--ink);padding:10px 16px;border-radius:12px;
  font-size:13.5px;opacity:0;transition:.22s;pointer-events:none;max-width:calc(100vw - 48px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.skel{color:var(--ink-3);font-size:13px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:460px){
  .mesnav{margin-left:0;width:100%;justify-content:space-between}
  .qa{grid-template-columns:1fr 1fr}
  .row{flex-wrap:wrap}
  .row .valcol{margin-left:auto}
}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="brand">Bolso<small>meu controle financeiro</small></div>
    <div class="mesnav">
      <button id="mprev" aria-label="Mês anterior">‹</button>
      <div class="meslabel num" id="meslabel">—</div>
      <button id="mnext" aria-label="Próximo mês">›</button>
      <button id="mhoje" class="hoje" hidden>HOJE</button>
      <span class="sep"></span>
      <button id="eye" aria-label="Ocultar valores"></button>
      <button id="lockbtn" aria-label="Bloqueio do app"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="resumo">RESUMO</button>
    <button class="tab" role="tab" data-tab="rendas">RENDAS</button>
    <button class="tab" role="tab" data-tab="despesas">DESPESAS</button>
    <button class="tab" role="tab" data-tab="agenda">📅 AGENDA</button>
    <button class="tab" role="tab" data-tab="corridas">🚗 CORRIDAS</button>
    <button class="tab" role="tab" data-tab="inv">INVESTIMENTOS</button>
  </nav>
  <div id="banner"></div>
  <main id="main"></main>
  <div id="sair" hidden style="text-align:center;margin-top:28px"><button class="btn mini" id="btn-sair">SAIR DA CONTA</button></div>
</div>

<dialog id="dlg"></dialog>
<div id="tip" role="tooltip"></div>
<div id="toast"></div>
<button class="fab" id="fab">+ GASTO</button>
<div id="lock" hidden>
  <form class="box" novalidate>
    <div class="lbrand">Bolso</div>
    <div class="lsub">meu controle financeiro</div>
    <input id="pin-in" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" aria-label="PIN">
    <div class="err" id="pin-err"></div>
    <button type="submit" class="btn primary">ENTRAR</button>
    <div class="forgot">Esqueceu o PIN? Me chama no Claude que te passo o destrava.</div>
  </form>
</div>
<div id="auth" hidden>
  <form class="box" novalidate>
    <div class="lbrand">Bolso</div>
    <div class="lsub">meu controle financeiro</div>
    <input id="auth-email" type="email" autocomplete="email" placeholder="E-mail" aria-label="E-mail">
    <input id="auth-senha" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha">
    <div class="err" id="auth-err"></div>
    <div class="btnrow">
      <button type="submit" class="btn primary">ENTRAR</button>
      <button type="button" class="btn" id="btn-criar">CRIAR CONTA</button>
    </div>
    <div class="forgot">Primeira vez? Bota e-mail e senha (mínimo 6 caracteres) e clica em CRIAR CONTA.</div>

<script>
"use strict";
/* ============================== utils ============================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const CPT=new Intl.NumberFormat("pt-BR",{notation:"compact",maximumFractionDigits:1});
const fmt=v=>S.hide?"R$ ••••":BRL.format(round2(v||0));
const fmtK=v=>S.hide?"••••":"R$ "+CPT.format(round2(v||0));
const round2=v=>Math.round((+v||0)*100)/100;
const sum=a=>round2(a.reduce((t,v)=>t+(+v||0),0));
const pct=(v)=>new Intl.NumberFormat("pt-BR",{maximumFractionDigits:1}).format(v*100)+"%";
function parseMoney(s){
  if(typeof s==="number")return round2(s);
  s=String(s||"").trim().replace(/R\$\s?/i,"").replace(/\s/g,"");
  if(!s)return NaN;
  if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,"").replace(",",".");
  else s=s.replace(/,/g,"");
  const v=parseFloat(s);
  return isNaN(v)?NaN:round2(v);
}
const pad=n=>String(n).padStart(2,"0");
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const ymNow=()=>todayISO().slice(0,7);
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MESAB=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const ymLabel=ym=>{const[y,m]=ym.split("-");return MESES[+m-1]+" "+y};
const ymShort=ym=>MESAB[+ym.slice(5,7)-1]+"/"+ym.slice(2,4);
const addMonths=(ym,n)=>{const[y,m]=ym.split("-").map(Number);const t=y*12+(m-1)+n;return Math.floor(t/12)+"-"+pad(((t%12)+12)%12+1)};
const diffM=(a,b)=>{const[ya,ma]=a.split("-").map(Number),[yb,mb]=b.split("-").map(Number);return (yb-ya)*12+(mb-ma)};
function addMonthsDate(iso,n){ // soma meses a uma data completa, segurando o dia no fim do mês
  const y=+iso.slice(0,4),m=+iso.slice(5,7),d=+iso.slice(8,10);
  const t=y*12+(m-1)+n, ny=Math.floor(t/12), nm=((t%12)+12)%12;
  const last=new Date(Date.UTC(ny,nm+1,0)).getUTCDate();
  return ny+"-"+pad(nm+1)+"-"+pad(Math.min(d,last));
}
function faturaMesDe(c,dataISO){ // em que fatura (mês de pagamento) cai uma compra nesse cartão
  const dia=+dataISO.slice(8,10), M=dataISO.slice(0,7);
  const mFecha=dia<(+c.diaFecha||1)?M:addMonths(M,1);      // mês em que a fatura fecha
  return (+c.diaVenc||31)>(+c.diaFecha||1)?mFecha:addMonths(mFecha,1); // paga no mesmo mês ou no seguinte
}
const cartoesAtivos=()=>S.cartoes.filter(c=>c.ativo!==false);
const cartaoNome=id=>{const c=S.cartoes.find(x=>x.id===id);return c?c.nome:""};
const dBR=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7)+"/"+iso.slice(0,4):"";
const dShort=iso=>iso?iso.slice(8,10)+"/"+iso.slice(5,7):"";
const uid=()=> (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const validYM=s=>/^\d{4}-\d{2}$/.test(s||"");
function niceMax(v){if(!(v>0))return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const k of[1,1.5,2,2.5,3,4,5,6,8,10]){if(v<=k*p)return k*p}return 10*p}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove("show"),2600)}

/* ============================== estado ============================== */
const CAT_RENDA=["Salário","Adicional","Aluguel","Auxílio","Bônus","13º","Extra","Corridas","Outros"];
const CAT_DESP=["Casa","Carro","Corridas","Saúde","Mercado","Alimentação fora","Transporte","Lazer","Viagens","Educação","Assinaturas","Planos","Família","Outros"];

const FORMAS=[["pix","Pix"],["dinheiro","Dinheiro"],["debito","Débito"],["vexpenses","VExpenses"],["credito","Cartão de crédito"]];
function formaLabel(f){return ({pix:"Pix",dinheiro:"Dinheiro",debito:"Débito",vexpenses:"VExpenses",credito:"Crédito"})[f]||f}
const COLS=["fontes","fixas","lanc","inv","cartoes","metas","corridas"];
/* categorias: as padrão + as que o usuário criou (ficam na configuração) */
function extrasCat(k){return (Array.isArray(S.cfg[k])?S.cfg[k]:[]).filter(c=>c&&typeof c==="string")}
function juntaCat(base,extras){const sem=base.filter(c=>c!=="Outros");const out=[...sem];for(const e of extras)if(!out.includes(e))out.push(e);out.push("Outros");return out}
function catDesp(){return juntaCat(CAT_DESP,extrasCat("catDespExtra"))}

const S={
  mes:ymNow(), tab:"resumo",

  db:null, mem:false, conectando:true, loaded:{},

};
/* ----- privacidade: olhinho + bloqueio por PIN ----- */
const EYE='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg>';
function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
function lsSet(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(_){}}
function ssGet(k){try{return sessionStorage.getItem(k)}catch(_){return null}}
function ssSet(k,v){try{sessionStorage.setItem(k,v)}catch(_){}}
async function pinDigest(pin){
  const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("bolso:"+pin));
  return Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,"0")).join("");
}
function showLock(){S.locked=true;$("#lock").hidden=false;$("#pin-err").textContent="";const i=$("#pin-in");if(i){i.value="";setTimeout(()=>i.focus(),60);}}
function hideLock(){S.locked=false;$("#lock").hidden=true;if(S.pendGasto){S.pendGasto=0;setTimeout(()=>gastoDialog(),80);}}
async function tryUnlock(){

  if(!S.cfg.pinHash){$("#pin-err").textContent="Ainda conectando… tenta de novo";return;}

  else{$("#pin-err").textContent="PIN errado";$("#pin-in").value="";$("#pin-in").focus();}
}

/* ============================ regras puras ============================ */
function fontePrev(f){return round2((+f.valor||0)*(1+((+f.adicionalPct||0)/100)))}
function fonteAplica(f,mes){
  if(f.ativo===false)return false;
  if(validYM(f.fimMes)&&mes>f.fimMes)return false;
  const t=f.tipo||"mensal", r=f.mesRef;
  if(t==="mensal")   return !validYM(r)||mes>=r;
  if(t==="intervalo"){if(!validYM(r))return false;const d=diffM(r,mes),n=Math.max(1,+f.intervalo||3);return d>=0&&d%n===0;}
  if(t==="anual")    {if(!validYM(r))return false;const d=diffM(r,mes);return d>=0&&d%12===0;}
  if(t==="unica")    return mes===r;
  return false;
}
function fixaAplica(x,mes){
  if(x.ativo===false)return false;
  if(validYM(x.inicioMes)&&mes<x.inicioMes)return false;
  if(validYM(x.fimMes)&&mes>x.fimMes)return false;
  return true;
}
function monthData(mes){
  const fontes=S.fontes.filter(f=>fonteAplica(f,mes));
  const fixas=S.fixas.filter(x=>fixaAplica(x,mes));
  const lan=S.lanc.filter(l=>l.mes===mes);
  const recByRef={},pagByRef={};
  for(const l of lan){
    if(l.tipo==="renda"&&l.refId)recByRef[l.refId]=l;
    if(l.tipo==="fixa"&&l.refId)pagByRef[l.refId]=l;
  }
  const rendPrev=sum(fontes.map(fontePrev));
  const rendReal=sum(lan.filter(l=>l.tipo==="renda").map(l=>l.valor));
  const fixoPrev=sum(fixas.map(x=>x.valor));
  const fixoReal=sum(lan.filter(l=>l.tipo==="fixa").map(l=>l.valor));
  const avulso=sum(lan.filter(l=>l.tipo==="avulsa").map(l=>l.valor));
  const guard=sum(lan.filter(l=>l.tipo==="aporte").map(l=>l.valor));
  const gasto=round2(fixoReal+avulso);
  const futuras=lan.filter(l=>l.tipo==="futura");
  const futuroPrev=sum(futuras.map(l=>l.valor));
  const faturaCartao=lan.filter(l=>l.tipo==="cartao");
  const comprasNovas=S.lanc.filter(l=>l.tipo==="cartao"&&(l.parcela||1)===1&&(l.data||"").slice(0,7)===mes);
  const comprasNovasTot=sum(comprasNovas.map(l=>l.valorTotal!=null?l.valorTotal:l.valor));
  return {mes,fontes,fixas,lan,recByRef,pagByRef,rendPrev,rendReal,fixoPrev,fixoReal,avulso,guard,gasto,
    faturaCartao,comprasNovas,comprasNovasTot,futuras,futuroPrev,
    saldo:round2(rendReal-gasto-guard)};
}
/* ---------- 1) contas vencendo (sempre pelo mês de HOJE) ---------- */
function vencimentos(janela){
  janela=janela==null?5:janela;
  const hojeISO=todayISO(), mes=hojeISO.slice(0,7), d=monthData(mes);
  const diaHoje=+hojeISO.slice(8,10);
  const ultimo=new Date(+mes.slice(0,4),+mes.slice(5,7),0).getDate();
  const out=[];
  for(const x of d.fixas){
    if(d.pagByRef[x.id]||!x.diaVenc)continue;
    const dia=Math.min(+x.diaVenc,ultimo);
    const falta=dia-diaHoje;
    if(falta>janela)continue;
    const extra=x.ehCartao?sum(d.faturaCartao.map(q=>q.valor)):0;
    out.push({id:x.id,tipo:"fixa",nome:x.nome,valor:round2((+x.valor||0)+extra),falta});
  }
  for(const l of S.lanc){
    if(l.tipo!=="futura"||!l.data)continue;
    const falta=Math.round((new Date(l.data+"T12:00:00")-new Date(hojeISO+"T12:00:00"))/864e5);
    if(falta>janela)continue;
    out.push({id:l.id,tipo:"futura",nome:l.desc||"Planejada",valor:+l.valor||0,falta});
  }
  return out.sort((a,b)=>a.falta-b.falta);
}
function quandoTxt(f){
  if(f<-1)return "venceu há "+(-f)+" dias";
  if(f===-1)return "venceu ontem";
  if(f===0)return "vence HOJE";
  if(f===1)return "vence amanhã";
  return "vence em "+f+" dias";
}

/* ---------- 2) teto por categoria ---------- */
function gastoPorCat(mes){
  const d=monthData(mes), cartaoFixa=new Set(S.fixas.filter(x=>x.ehCartao).map(x=>x.id));
  const by={};
  for(const l of d.lan){
    let entra=false;
    if(l.tipo==="avulsa"||l.tipo==="cartao")entra=true;
    /* a fatura paga não conta de novo: as compras dela já entram pela categoria de cada uma */
    else if(l.tipo==="fixa")entra=!(l.refId&&cartaoFixa.has(l.refId));
    if(entra){const c=l.cat||"Outros";by[c]=round2((by[c]||0)+(+l.valor||0));}
  }
  return by;
}
function tetos(){const t=S.cfg.tetos;return t&&typeof t==="object"?t:{}}
function statusTetos(mes){
  const t=tetos(), g=gastoPorCat(mes);
  return Object.keys(t).filter(c=>+t[c]>0).map(c=>{
    const teto=+t[c], gasto=g[c]||0, p=gasto/teto;
    return {cat:c,teto,gasto,p,cls:p>=1?"neg":p>=0.8?"warntx":"pos"};
  }).sort((a,b)=>b.p-a.p);
}
function avisaTeto(cat,mes){
  const s=statusTetos(mes).find(x=>x.cat===cat);
  if(!s)return;
  if(s.p>=1)setTimeout(()=>toast("⚠️ "+cat+" passou do teto: "+fmt(s.gasto)+" de "+fmt(s.teto)),2700);
  else if(s.p>=0.8)setTimeout(()=>toast("Atenção: "+cat+" já está em "+Math.round(s.p*100)+"% do teto"),2700);
}

/* ---------- 3) metas ---------- */
function metaGuardado(m){
  return round2((+m.inicial||0)+sum(S.lanc.filter(l=>l.metaId===m.id).map(l=>l.valor)));
}
function metaInfo(m){
  const tem=metaGuardado(m), alvo=+m.alvo||0, falta=Math.max(0,round2(alvo-tem));
  const p=alvo>0?Math.min(1,tem/alvo):0;
  let porMes=null, meses=null;
  if(validYM(m.prazo)){meses=diffM(ymNow(),m.prazo)+1;if(meses>0&&falta>0)porMes=round2(falta/meses);}
  return {tem,alvo,falta,p,porMes,meses};
}

/* ---------- corridas (Uber, 99...) ---------- */
const APPS_CORRIDA=["Uber","99","inDrive","Particular","Outro"];
function corridaCusto(c){return round2((+c.combustivel||0)+(+c.outros||0))}
function corridaLucro(c){return round2((+c.bruto||0)-corridaCusto(c))}
function corridasDoMes(mes){return S.corridas.filter(c=>(c.data||"").slice(0,7)===mes).sort((a,b)=>(b.data||"").localeCompare(a.data||""))}
function resumoCorridas(lista){
  const bruto=sum(lista.map(c=>c.bruto)), custo=sum(lista.map(corridaCusto));
  const horas=round2(lista.reduce((t,c)=>t+(+c.horas||0),0)), km=round2(lista.reduce((t,c)=>t+(+c.km||0),0));
  const lucro=round2(bruto-custo), desg=+S.cfg.desgasteKm||0;
  const real=round2(lucro-km*desg);
  return {dias:lista.length,bruto,custo,lucro,horas,km,
    porHora:horas>0?round2(lucro/horas):null, porKm:km>0?round2(bruto/km):null,
    custoKm:km>0?round2(custo/km):null, desg, real, realHora:horas>0?round2(real/horas):null};
}
const DIAS_SEM=["domingo","segunda","terça","quarta","quinta","sexta","sábado"];
function melhoresDias(){
  const by={};
  for(const c of S.corridas){
    if(!c.data||!(+c.horas>0))continue;
    const w=new Date(c.data+"T12:00:00").getDay();
    const b=by[w]||(by[w]={lucro:0,horas:0,n:0});
    b.lucro+=corridaLucro(c);b.horas+=+c.horas;b.n++;
  }
  return Object.keys(by).map(w=>({dia:DIAS_SEM[w],porHora:round2(by[w].lucro/by[w].horas),n:by[w].n}))
    .sort((a,b)=>b.porHora-a.porHora);
}

/* ---------- dívidas parceladas ---------- */
function dividaInfo(x){
  const pagasApp=S.lanc.filter(l=>l.tipo==="fixa"&&l.refId===x.id).length;
  const hoje=ymNow(), pagoMes=!!monthData(hoje).pagByRef[x.id];
  if(x.parcelas){
    const n=+x.parcelas, pagas=Math.min(n,(+x.jaPagas||0)+pagasApp+(+x.adiantadas||0)), faltam=Math.max(0,n-pagas);
    return {n,pagas,faltam,falta:round2(faltam*(+x.valor||0)),fim:x.fimMes,p:n?pagas/n:0};
  }
  if(validYM(x.fimMes)){
    const faltam=Math.max(0,diffM(hoje,x.fimMes)+1-(pagoMes?1:0));
    return {n:null,pagas:null,faltam,falta:round2(faltam*(+x.valor||0)),fim:x.fimMes,p:null};
  }
  return null;
}
function dividas(){
  return S.fixas.filter(x=>x.ativo!==false&&!x.ehCartao).map(x=>({x,i:dividaInfo(x)}))
    .filter(o=>o.i&&o.i.faltam>0).sort((a,b)=>(a.i.fim||"").localeCompare(b.i.fim||""));
}

/* ---------- VExpenses (benefício) ---------- */
function vexFonte(){return S.fontes.find(f=>f.id===S.cfg.vexFonteId)||null}
function vexInfo(mes){
  const f=vexFonte();
  const usouL=l=>(l.tipo==="avulsa"||l.tipo==="fixa")&&l.forma==="vexpenses";
  const usadoMes=sum(S.lanc.filter(l=>usouL(l)&&l.mes===mes).map(l=>l.valor));
  const recebMes=f?sum(S.lanc.filter(l=>l.tipo==="renda"&&l.refId===f.id&&l.mes===mes).map(l=>l.valor)):0;
  const recebTot=f?sum(S.lanc.filter(l=>l.tipo==="renda"&&l.refId===f.id).map(l=>l.valor)):0;
  const usadoTot=sum(S.lanc.filter(usouL).map(l=>l.valor));
  return {f,mensal:f?fontePrev(f):0,recebMes,usadoMes,saldo:round2(recebTot-usadoTot)};
}
/* cadastra sozinho o benefício VExpenses de R$ 1.070 na primeira vez que abre */
let vexChecado=false;
async function garantirVex(){
  if(vexChecado||S.cfg.vexSetup)return;

  }

/* ---------- previsão do fim do mês ---------- */
function previsaoMes(){
  const mes=ymNow(), d=monthData(mes);
  const dia=+todayISO().slice(8,10), diasMes=new Date(+mes.slice(0,4),+mes.slice(5,7),0).getDate();
  const restam=diasMes-dia;
  const rendPend=sum(d.fontes.filter(f=>!d.recByRef[f.id]).map(fontePrev));
  const fatComp=sum(d.faturaCartao.map(l=>l.valor));
  const fixPend=sum(d.fixas.filter(x=>!d.pagByRef[x.id]).map(x=>round2((+x.valor||0)+(x.ehCartao?fatComp:0))));
  const futPend=d.futuroPrev;
  /* ritmo dos gastos do dia a dia (avulsas) — com menos de 3 dias ainda não dá pra projetar */
  const porDia=dia>=3?round2(d.avulso/dia):null;
  const avulsoProj=porDia!=null?round2(d.avulso+porDia*restam):d.avulso;
  const entra=round2(d.rendReal+rendPend);
  const sai=round2(d.fixoReal+fixPend+avulsoProj+futPend+d.guard);
  const saldo=round2(entra-sai);
  /* quanto ainda dá pra gastar por dia sem ficar negativo */
  const folga=round2(entra-(d.fixoReal+fixPend+futPend+d.guard+d.avulso));
  const podeDia=restam>0?round2(folga/restam):null;
  return {mes,dia,diasMes,restam,entra,sai,saldo,porDia,avulsoProj,fixPend,futPend,rendPend,podeDia,folga};
}

/* ---------- raio-x das assinaturas ---------- */
const CATS_ASSIN=["Assinaturas","Planos"];
function assinaturas(){
  const hoje=ymNow(), lim=addMonths(hoje,-2);
  const out=[];
  for(const x of S.fixas){
    if(!fixaAplica(x,hoje)||x.ehCartao)continue;
    if(CATS_ASSIN.includes(x.cat))out.push({nome:x.nome,mensal:+x.valor||0,origem:"fixa"});
  }
  /* compras avulsas/crédito de assinatura que se repetem nos últimos 3 meses */
  const grupos={};
  for(const l of S.lanc){
    if(!["avulsa","cartao"].includes(l.tipo)||!CATS_ASSIN.includes(l.cat))continue;
    if((l.mes||"")<lim||(l.mes||"")>hoje)continue;
    const k=semAcento((l.desc||"").replace(/\s*\(\d+\/\d+\)\s*$/,"")).trim()||"assinatura";
    const g=grupos[k]||(grupos[k]={nome:(l.desc||"Assinatura").replace(/\s*\(\d+\/\d+\)\s*$/,""),meses:{},tot:0});
    g.meses[l.mes]=(g.meses[l.mes]||0)+(+l.valor||0);g.tot+=+l.valor||0;
  }
  for(const k in grupos){
    const g=grupos[k], n=Object.keys(g.meses).length;
    if(out.some(o=>semAcento(o.nome)===semAcento(g.nome)))continue;
    out.push({nome:g.nome,mensal:round2(g.tot/n),origem:n>=2?"repete":"1x"});
  }
  return out.sort((a,b)=>b.mensal-a.mensal);
}

/* ---------- voz: "mercado cinquenta e seis e noventa" ---------- */
const NUM_PT={zero:0,um:1,uma:1,dois:2,duas:2,"tres":3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12,treze:13,
  quatorze:14,catorze:14,quinze:15,dezesseis:16,dezessete:17,dezoito:18,dezenove:19,vinte:20,trinta:30,quarenta:40,cinquenta:50,
  sessenta:60,setenta:70,oitenta:80,noventa:90,cem:100,cento:100,duzentos:200,trezentos:300,quatrocentos:400,quinhentos:500,
  seiscentos:600,setecentos:700,oitocentos:800,novecentos:900};
function palavrasParaNum(toks){
  let total=0,atual=0,achou=false;
  for(const t of toks){
    if(t in NUM_PT){atual+=NUM_PT[t];achou=true;}
    else if(t==="mil"){atual=(atual||1)*1000;total+=atual;atual=0;achou=true;}
    else if(/^\d+$/.test(t)){atual+=+t;achou=true;}
  }
  return achou?total+atual:null;
}
const CAT_PISTA=[
  ["Mercado",/mercado|supermercado|feira|atacad|hortifruti|padaria|acougue/],
  ["Alimentação fora",/ifood|lanche|restaurante|almoco|jantar|pizza|hamburguer|cafe|bar\b|marmita|delivery/],
  ["Transporte",/gasolina|combustivel|posto|alcool|etanol|estacionamento|pedagio|onibus|metro|passagem|uber\b|99\b/],
  ["Saúde",/farmacia|remedio|medico|consulta|exame|dentista|drogaria/],
  ["Assinaturas",/netflix|spotify|prime|disney|youtube|globoplay|max\b|deezer|icloud|assinatura/],
  ["Casa",/aluguel|luz|energia|agua|gas\b|internet|condominio|iptu|limpeza/],
  ["Lazer",/cinema|show|jogo|passeio|praia|festa|ingresso/],
  ["Educação",/curso|escola|faculdade|livro|material/],
  ["Carro",/oficina|mecanico|pneu|oleo|revisao|lavagem|ipva|seguro/]
];
function entenderFala(txt){
  /* "#" marca onde a pessoa falou "reais" (separa reais de centavos) */
  let t=semAcento(txt).replace(/r\$\s*/g,"").replace(/\breais?\b/g," # ").replace(/\bcentavos?\b/g," ").replace(/\s+/g," ").trim();
  let valor=null, resto=t;
  /* 1) número com dígitos: "56,90" "56.90" "56 e 90" "56 reais e 90" */
  const m=t.match(/(\d+)(?:[.,](\d{1,2})|\s+(?:#\s+)?(?:e\s+)?(\d{2})(?!\d))?(?!\d)/);
  if(m){valor=+(m[1]+"."+((m[2]||m[3]||"0").padEnd(2,"0")));resto=t.replace(m[0]," ");}
  else{
    /* 2) por extenso */
    const toks=t.split(" ");
    const ehNum=w=>w in NUM_PT||w==="mil";
    const idx=toks.map((w,i)=>ehNum(w)?i:-1).filter(i=>i>=0);
    if(idx.length){
      const ini=idx[0], fim=idx[idx.length-1];
      const trecho=toks.slice(ini,fim+1);
      let reaisT=trecho, centT=[];
      const cerq=trecho.indexOf("#");
      if(cerq>=0){reaisT=trecho.slice(0,cerq);centT=trecho.slice(cerq+1);}
      else{
        /* "cinquenta e seis e noventa": o último "e" só separa centavos quando
           não dá pra ser parte do mesmo número (ex: "cento e vinte e cinco" = 125) */
        for(let k=trecho.length-1;k>0;k--){
          if(trecho[k]!=="e")continue;
          const antes=trecho[k-1], vA=antes==="mil"?1000:NUM_PT[antes];
          const cent=palavrasParaNum(trecho.slice(k+1));
          if(vA==null||cent==null||cent>=100)continue;
          const compoe=vA>=100||(vA>=20&&vA%10===0&&cent<10);
          if(!compoe){reaisT=trecho.slice(0,k);centT=trecho.slice(k+1);}
          break;
        }
      }
      const reais=palavrasParaNum(reaisT.filter(w=>w!=="#"));
      const cent=centT.length?palavrasParaNum(centT):0;
      if(reais!=null)valor=round2(reais+(cent&&cent<100?cent:0)/100);
      resto=toks.slice(0,ini).concat(toks.slice(fim+1)).join(" ");
    }
  }
  const desc=resto.replace(/#/g," ").replace(/\b(e|de|no|na|do|da|com|paguei|gastei|foi)\b/g," ").replace(/\s+/g," ").trim();
  let cat="Outros";
  for(const [c,re] of CAT_PISTA)if(re.test(t)){cat=c;break;}
  /* devolve a descrição com os acentos que a pessoa falou ("farmácia", não "farmacia") */
  const sobra=new Set(desc.split(" ").filter(Boolean));
  const comAcento=String(txt||"").split(/\s+/).filter(w=>sobra.has(semAcento(w).replace(/[^a-z0-9]/g,""))).join(" ").toLowerCase();
  const d2=comAcento||desc;
  return {valor,desc:d2?d2.charAt(0).toUpperCase()+d2.slice(1):"",cat};
}

/* ---------- plano pra quitar as dívidas ---------- */
function simularQuitacao(extra,estrategia){
  const ds=dividas().map(o=>({id:o.x.id,nome:o.x.nome,parc:+o.x.valor||0,saldo:o.i.falta,fim:null}));
  if(!ds.length)return null;
  let mes=ymNow(), livre=0, pool=0, n=0;
  const ordem=()=>ds.filter(d=>d.saldo>0).sort(estrategia==="menor"?(a,b)=>a.saldo-b.saldo:(a,b)=>b.parc-a.parc);
  while(ds.some(d=>d.saldo>0)&&n<600){
    pool=extra+livre;
    for(const d of ds){if(d.saldo<=0)continue;const pg=Math.min(d.parc,d.saldo);d.saldo=round2(d.saldo-pg);}
    for(const d of ordem()){if(pool<=0)break;const pg=Math.min(pool,d.saldo);d.saldo=round2(d.saldo-pg);pool=round2(pool-pg);}
    for(const d of ds)if(d.saldo<=0&&!d.fim){d.fim=mes;livre=round2(livre+d.parc);}
    mes=addMonths(mes,1);n++;
  }
  const fimGeral=ds.map(d=>d.fim).filter(Boolean).sort().pop();
  return {fim:fimGeral,ordem:ds.slice().sort((a,b)=>(a.fim||"").localeCompare(b.fim||""))};
}

/* ---------- relatório do ano ---------- */
function dadosAno(ano){
  const meses=[];
  for(let m=1;m<=12;m++){const ym=ano+"-"+pad(m);const d=monthData(ym);meses.push({ym,rec:d.rendReal,gas:d.gasto,gua:d.guard,sob:d.saldo,cat:gastoPorCat(ym)});}
  const cats={};
  for(const m of meses)for(const c in m.cat)cats[c]=round2((cats[c]||0)+m.cat[c]);
  const comDado=meses.filter(m=>m.rec||m.gas||m.gua);
  return {ano,meses,cats:Object.entries(cats).sort((a,b)=>b[1]-a[1]),
    rec:sum(meses.map(m=>m.rec)),gas:sum(meses.map(m=>m.gas)),gua:sum(meses.map(m=>m.gua)),sob:sum(meses.map(m=>m.sob)),
    caro:comDado.slice().sort((a,b)=>b.gas-a.gas)[0]||null, melhor:comDado.slice().sort((a,b)=>b.sob-a.sob)[0]||null,
    nMeses:comDado.length};
}

/* ---------- meta de corrida do mês: quanto preciso fazer ---------- */
function metaCorrida(){
  const mes=ymNow(), d=monthData(mes);
  const dia=+todayISO().slice(8,10), diasMes=new Date(+mes.slice(0,4),+mes.slice(5,7),0).getDate();
  const restam=Math.max(0,diasMes-dia+1);   /* conta hoje: ainda dá pra rodar */
  const daCorr=l=>!!l.corridaId;
  const corrRenda=sum(d.lan.filter(l=>l.tipo==="renda"&&daCorr(l)).map(l=>l.valor));
  const corrCusto=sum(d.lan.filter(l=>l.tipo==="avulsa"&&daCorr(l)).map(l=>l.valor));
  /* a previsão do mês SEM as corridas: o buraco que elas precisam cobrir */
  const rendPend=sum(d.fontes.filter(f=>!d.recByRef[f.id]).map(fontePrev));
  const fatComp=sum(d.faturaCartao.map(l=>l.valor));
  const fixPend=sum(d.fixas.filter(x=>!d.pagByRef[x.id]).map(x=>round2((+x.valor||0)+(x.ehCartao?fatComp:0))));
  const avSem=round2(d.avulso-corrCusto);
  const porDia=dia>=3?avSem/dia:0;
  const avProj=round2(avSem+porDia*Math.max(0,diasMes-dia));
  const entraSem=round2(d.rendReal-corrRenda+rendPend);
  const saiSem=round2(d.fixoReal+fixPend+avProj+d.futuroPrev+d.guard);
  const saldoSem=round2(entraSem-saiSem);
  const cfg=S.cfg.metaCorr||{};
  const metasMes=cfg.metas===false?0:sum(S.metas.map(m=>{const i=metaInfo(m);return i.falta>0&&i.porMes?i.porMes:0;}));
  const extraDiv=cfg.dividas===false?0:(+S.cfg.extraDivida||0);
  const sobra=+cfg.sobra||0;
  const buraco=Math.max(0,round2(-saldoSem));
  const fixa=+cfg.fixa||0;
  const precisa=fixa>0?fixa:round2(buraco+metasMes+extraDiv+sobra);
  const feito=round2(corrRenda-corrCusto);
  const falta=Math.max(0,round2(precisa-feito));
  /* médias de tudo que tu já rodou */
  const r=resumoCorridas(S.corridas);
  const lucroDia=r.dias?round2(r.lucro/r.dias):null;
  const custoPct=r.bruto>0?r.custo/r.bruto:null;
  const diasPrec=lucroDia>0?Math.ceil(falta/lucroDia):null;
  const horasPrec=r.porHora>0?round2(falta/r.porHora):null;
  const brutoPrec=custoPct!=null&&custoPct<1?round2(falta/(1-custoPct)):null;
  const kmPrec=r.km>0&&r.bruto>0&&brutoPrec!=null?Math.round(brutoPrec/(r.bruto/r.km)):null;
  return {mes,dia,diasMes,restam,precisa,feito,falta,buraco,metasMes,extraDiv,sobra,fixa,saldoSem,
    lucroDia,diasPrec,horasPrec,brutoPrec,kmPrec,porDiaRest:restam>0?round2(falta/restam):null,
    temHist:r.dias>0,p:precisa>0?Math.min(1,feito/precisa):1};
}

/* ---------- custo de vida médio (base da reserva e da nota) ---------- */
function custoVida(){
  const hoje=ymNow(), ms=[1,2,3].map(i=>addMonths(hoje,-i)).map(monthData).filter(d=>d.gasto>0);
  if(ms.length)return {valor:round2(sum(ms.map(d=>d.gasto))/ms.length),base:ms.length+" mês(es) anteriores"};
  const d=monthData(hoje);
  return {valor:round2(Math.max(d.gasto,d.fixoPrev)),base:"este mês"};
}
function rendaMedia(){
  const hoje=ymNow(), ms=[0,1,2].map(i=>addMonths(hoje,-i)).map(monthData);
  const reais=ms.filter(d=>d.rendReal>0);
  if(reais.length)return round2(sum(reais.map(d=>d.rendReal))/reais.length);
  return monthData(hoje).rendPrev;
}

/* ---------- 1) reserva de emergência ---------- */
function reservaInfo(){
  const liq=S.inv.filter(i=>(i.liquidez||"diaria")==="diaria"||liquidezInfo(i).cls==="pos");
  const total=sum(liq.map(i=>i.atual));

/* ---------- 2) nota da saúde financeira ---------- */
function saudeFinanceira(){
  const hoje=ymNow(), d=monthData(hoje), renda=rendaMedia();

    {k:"comp",nome:"Contas fixas",pts:comp==null?12:Math.round(25*lin(comp,0.3,0.7)),
      txt:comp==null?"cadastra tuas rendas pra eu calcular":Math.round(comp*100)+"% da renda vai pras fixas",
      dica:"Tenta deixar as contas fixas abaixo de 30% do que entra — renegocia plano, seguro, assinatura."},
    {k:"res",nome:"Reserva",pts:res.meses==null?0:Math.round(25*Math.min(1,res.meses/6)),
      txt:res.meses==null?"sem reserva calculada":String(res.meses).replace(".",",")+" mês(es) de custo de vida",
      dica:"Monta a reserva de emergência: 6 meses de custo de vida num investimento de resgate diário."},
    {k:"div",nome:"Dívidas",pts:renda>0?Math.round(25*lin(deve/renda,0,6)):(deve>0?0:25),
      txt:deve>0?"deve "+fmt(deve)+(renda>0?" ("+String(round2(deve/renda)).replace(".",",")+"× a renda)":""):"sem dívida parcelada 👏",
      dica:"Quita as dívidas mais rápido: usa o plano 🚀 na aba Despesas e o ADIANTAR quando sobrar."},
    {k:"pou",nome:"Guardando",pts:Math.round(25*lin(pou,0.1,0)),
      txt:renda>0?"guarda "+Math.round(pou*100)+"% da renda (média 3 meses)":"—",
      dica:"Guarda pelo menos 10% do que entra todo mês — de preferência logo que o dinheiro cai."}
  ];
  const nota=sum(itens.map(i=>i.pts));
  const pior=itens.slice().sort((a,b)=>a.pts-b.pts)[0];
  const faixa=nota>=80?["Ótima","pos"]:nota>=60?["Boa","pos"]:nota>=40?["Atenção","warntx"]:["Crítica","neg"];
  return {nota:Math.round(nota),itens,pior,faixa};
}

/* ---------- 3) gasto fora do normal ---------- */
/* só o gasto do dia a dia (avulsas e compras no crédito): conta fixa é esperada, não é "fora do normal" */
function gastoVarPorCat(mes){
  const by={};
  for(const l of S.lanc){
    if(l.mes!==mes||!(l.tipo==="avulsa"||l.tipo==="cartao")||l.corridaId||l.dividaId)continue;
    const c=l.cat||"Outros";by[c]=round2((by[c]||0)+(+l.valor||0));
  }
  return by;
}
function foraDoNormal(mes){
  const hoje=ymNow(), atual=gastoVarPorCat(mes);
  const ant=[1,2,3].map(i=>addMonths(mes,-i)).filter(m=>monthData(m).gasto>0).map(gastoVarPorCat);
  if(!ant.length)return [];
  let fator=1;
  if(mes===hoje){
    const dia=+todayISO().slice(8,10), diasMes=new Date(+mes.slice(0,4),+mes.slice(5,7),0).getDate();
    if(dia<7)return [];
    fator=diasMes/dia;
  }
  const out=[];
  for(const c in atual){
    const media=sum(ant.map(a=>a[c]||0))/ant.length;
    if(!(media>0))continue;
    const proj=round2(atual[c]*fator), p=proj/media-1;
    if(p>=0.3&&proj-media>=50)out.push({cat:c,atual:atual[c],proj,media:round2(media),p,proj:proj});
  }
  return out.sort((a,b)=>b.p-a.p);
}

/* ---------- 4) calendário do mês ---------- */
function agendaMes(mes){
  const d=monthData(mes), hoje=todayISO();
  const ultimo=new Date(+mes.slice(0,4),+mes.slice(5,7),0).getDate();
  const dias={};
  const add=(dia,ev)=>{dia=Math.min(ultimo,Math.max(1,dia||1));(dias[dia]=dias[dia]||[]).push(ev);};
  const semDia=[];
  for(const f of d.fontes){
    const l=d.recByRef[f.id];
    if(l)add(+String(l.data||"").slice(8,10)||1,{t:"in",nome:f.nome,valor:l.valor,ok:true});
    else if(f.diaReceb)add(+f.diaReceb,{t:"in",nome:f.nome,valor:fontePrev(f),ok:false});
    else semDia.push({t:"in",nome:f.nome,valor:fontePrev(f)});
  }
  for(const l of d.lan.filter(l=>l.tipo==="renda"&&!l.refId))add(+String(l.data||"").slice(8,10)||1,{t:"in",nome:l.desc||"Renda",valor:l.valor,ok:true});
  const fat=sum(d.faturaCartao.map(q=>q.valor));
  for(const x of d.fixas){
    const l=d.pagByRef[x.id], v=round2((+x.valor||0)+(x.ehCartao?fat:0));
    if(l)add(+String(l.data||"").slice(8,10)||(+x.diaVenc||1),{t:"out",nome:x.nome,valor:l.valor,ok:true});
    else if(x.diaVenc)add(+x.diaVenc,{t:"out",nome:x.nome,valor:v,ok:false,atrasada:mes+"-"+pad(Math.min(+x.diaVenc,ultimo))<hoje});
    else semDia.push({t:"out",nome:x.nome,valor:v});
  }
  for(const l of d.lan.filter(l=>l.tipo==="avulsa"||l.tipo==="aporte"||l.tipo==="futura"))
    add(+String(l.data||"").slice(8,10)||1,{t:"out",nome:l.desc||(l.tipo==="aporte"?"Guardado":"Gasto"),valor:l.valor,ok:l.tipo!=="futura",avulsa:l.tipo==="avulsa"});
  /* saldo do mês dia a dia (entradas − saídas, desde o dia 1) */
  let acc=0;const saldo={};let apertado=[];
  for(let i=1;i<=ultimo;i++){
    for(const e of (dias[i]||[]))acc=round2(acc+(e.t==="in"?e.valor:-e.valor));
    saldo[i]=acc;if(acc<0&&(dias[i]||[]).some(e=>e.t==="out"))apertado.push(i);
  }
  return {mes,ultimo,dias,saldo,semDia,apertado,primeiroSem:new Date(+mes.slice(0,4),+mes.slice(5,7)-1,1).getDay()};
}

/* ---------- 6) foto do comprovante ---------- */
function comprimirFoto(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1280, k=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error("falhou")),"image/jpeg",0.72);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("imagem inválida"));};
    img.src=url;
  });
}
function anexarFoto(l){
  const inp=document.createElement("input");
  inp.type="file";inp.accept="image/*";inp.setAttribute("capture","environment");
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    toast("Enviando a foto…");
    let blob;try{blob=await comprimirFoto(f);}catch(_){toast("Não consegui ler essa imagem");return;}
    let ref;
    if(S.mem){ref=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob);});}
    else{
      if(!USER)return;
      const path=USER.id+"/"+l.id+"-"+Date.now()+".jpg";
      const {error}=await sb.storage.from("comprovantes").upload(path,blob,{contentType:"image/jpeg",upsert:true});
      if(error){toast(/bucket|not found/i.test(error.message)?"Falta criar o espaço das fotos no Supabase (roda o SQL das fotos)":"Não enviou a foto: "+error.message);return;}
      if(l.foto&&!/^data:/.test(l.foto))sb.storage.from("comprovantes").remove([l.foto]).catch(()=>{});
      ref=path;
    }
    const ok=await dbSet("lanc",l.id,{...stripId(l),foto:ref});
    if(ok)toast("Comprovante anexado 📎");
  };
  inp.click();
}
async function verFoto(l){
  let url=l.foto;

function semAcento(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function buscarLanc(termo,per){
  const t=semAcento(termo).trim();
  if(t.length<2)return null;
  const hoje=ymNow(), ano=hoje.slice(0,4);
  const lim12=addMonths(hoje,-11);
  const partes=t.split(/\s+/);
  const achou=S.lanc.filter(l=>{
    if(!["avulsa","fixa","cartao","futura"].includes(l.tipo))return false;
    const m=l.mes||"";
    if(per==="ano"&&m.slice(0,4)!==ano)return false;
    if(per==="12m"&&(m<lim12||m>hoje))return false;
    const alvo=semAcento([l.desc,l.obs,l.cat,cartaoNome(l.cartaoId)].join(" "));
    return partes.every(p=>alvo.includes(p));
  }).sort((a,b)=>(b.data||b.mes||"").localeCompare(a.data||a.mes||""));
  return {itens:achou,total:sum(achou.filter(l=>l.tipo!=="futura").map(l=>l.valor))};
}

function tipoLabel(f){
  const t=f.tipo||"mensal";
  if(t==="mensal")return "Mensal";
  if(t==="intervalo")return "A cada "+(Math.max(1,+f.intervalo||3))+" meses";
  if(t==="anual")return validYM(f.mesRef)?"Todo "+MESES[+f.mesRef.slice(5,7)-1]:"Anual";
  if(t==="unica")return "Só em "+(validYM(f.mesRef)?ymShort(f.mesRef):"—");
  return t;
}

function fieldVisible(f){return !f.showIf||f.showIf(FD.vals)}
function renderFields(){
  const box=$("#f-fields");
  box.innerHTML=FD.cfg.fields.filter(fieldVisible).map(f=>{
    const v=FD.vals[f.k];
    const lab='<label class="fl" for="ff-'+f.k+'">'+esc(f.label)+(f.req?"":" <span style='text-transform:none;letter-spacing:0'>(opcional)</span>")+'</label>';
    let ctl="";
    if(f.type==="select")
      ctl='<select id="ff-'+f.k+'" data-k="'+f.k+'">'+f.opts.map(o=>{
        const val=Array.isArray(o)?o[0]:o, txt=Array.isArray(o)?o[1]:o;
        return '<option value="'+esc(val)+'"'+(String(v)===String(val)?" selected":"")+'>'+esc(txt)+'</option>';
      }).join("")+'</select>';
    else if(f.type==="check")
      return '<div class="checkrow"><input type="checkbox" id="ff-'+f.k+'" data-k="'+f.k+'"'+(v?" checked":"")+'><label for="ff-'+f.k+'">'+esc(f.label)+'</label></div>';
    else if(f.type==="info")
      return '<div class="hint">'+esc(f.label)+'</div>';
    else{
      const typ=f.type==="money"?'text" inputmode="decimal':f.type==="number"?'text" inputmode="decimal':f.type;
      ctl='<input id="ff-'+f.k+'" data-k="'+f.k+'" type="'+typ+'" value="'+esc(v??"")+'"'
        +(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'>';
    }
    return '<div>'+lab+ctl+(f.hint?'<div class="hint">'+esc(f.hint)+'</div>':'')+'<div class="err" id="fe-'+f.k+'"></div></div>';
  }).join("");
  box.querySelectorAll("[data-k]").forEach(el=>{
    el.addEventListener("input",()=>{FD.vals[el.dataset.k]=el.type==="checkbox"?el.checked:el.value;});
    el.addEventListener("change",()=>{
      FD.vals[el.dataset.k]=el.type==="checkbox"?el.checked:el.value;
      const f=FD.cfg.fields.find(x=>x.k===el.dataset.k);
      if(FD.cfg.onChange)FD.cfg.onChange(el.dataset.k,FD.vals);
      if(f&&f.reactive)renderFields();
    });
  });
}
function collectFields(validate){
  const out={};let ok=true;
  for(const f of FD.cfg.fields){
    if(f.type==="info")continue;
    if(!fieldVisible(f)){out[f.k]=undefined;continue;}
    let v=FD.vals[f.k];
    const err=$("#fe-"+f.k);if(err)err.textContent="";
    if(f.type==="money"){
      if(v===""||v==null){if(f.req){ok=flag(f,"Informa o valor");}else out[f.k]=undefined;continue;}
      const n=parseMoney(v);
      if(isNaN(n)||n<0){ok=flag(f,"Valor inválido — ex: 1.234,56");continue;}
      out[f.k]=n;
    }else if(f.type==="number"){
      if(v===""||v==null){if(f.req){ok=flag(f,"Preenche esse campo");}else out[f.k]=undefined;continue;}
      const n=parseFloat(String(v).replace(",","."));
      if(isNaN(n)){ok=flag(f,"Número inválido");continue;}
      out[f.k]=n;
    }else if(f.type==="check"){out[f.k]=!!v;}
    else{
      v=(v==null?"":String(v)).trim();
      if(f.req&&!v){ok=flag(f,"Preenche esse campo");continue;}
      if(f.type==="month"&&v&&!validYM(v)){ok=flag(f,"Usa o formato AAAA-MM, ex: 2026-12");continue;}
      out[f.k]=v||undefined;
    }
  }
  return validate&&!ok?null:out;
}

async function addGasto(v){
  const data=v.data||todayISO();
  if(v.forma==="credito"){
    const n=Math.max(1,Math.round(v.parcelas||1));
    const cid=uid();
    const base=Math.floor(v.valor/n*100)/100;
    const first=round2(v.valor-base*(n-1));
    const cart=S.cartoes.find(x=>x.id===v.cartaoId);
    const fm=validYM(v.faturaMes)?v.faturaMes:(cart?faturaMesDe(cart,data):addMonths(data.slice(0,7),1));
    let m=fm;
    for(let i=1;i<=n;i++){
      const doc={mes:m,tipo:"cartao",desc:v.desc+(n>1?" ("+i+"/"+n+")":""),cat:v.cat,
        valor:i===1?first:base,valorTotal:v.valor,parcela:i,parcelas:n,compraId:cid,data,forma:"credito"};
      if(cart)doc.cartaoId=cart.id;
      if(v.obs)doc.obs=v.obs;
      const ok=await dbSet("lanc",uid(),doc);
      if(!ok)return false;
      m=addMonths(m,1);
    }
    toast(n>1?"Lançado — "+n+"x a partir da fatura de "+ymShort(fm)+" ✓":"Lançado na fatura de "+ymShort(fm)+" ✓");
    avisaTeto(v.cat,fm);
    return true;
  }
  const fut=data>todayISO();
  const doc={mes:data.slice(0,7),tipo:fut?"futura":"avulsa",desc:v.desc,cat:v.cat,valor:v.valor,data,forma:v.forma||"pix"};
  if(v.obs)doc.obs=v.obs;
  const ok=await dbSet("lanc",uid(),doc);
  if(ok)toast(fut?"Planejada pra "+ymShort(data.slice(0,7))+" ✓ — entrou no previsto do mês":"Gasto lançado ✓");
  if(ok&&!fut)avisaTeto(v.cat,data.slice(0,7));
  return ok;
}

/* ---------- adiantar parcela ---------- */
function adiantarParcela(x){
  const i=dividaInfo(x);
  if(!i||i.faltam<=0){toast("Essa já está quitada 🎉");return;}
  openForm({
    title:"Adiantar — "+x.nome,
    sub:"Faltam "+i.faltam+" parcela(s) de "+fmt(x.valor)+". Adiantando, a última some e tu quita antes.",
    saveLabel:"ADIANTAR",
    reactiveAll:1,
    fields:[
      {k:"n",label:"Quantas parcelas vai adiantar",type:"number",req:1,value:"1",hint:"Máximo "+i.faltam+"."},
      {k:"valor",label:"Valor pago (R$)",type:"money",value:"",ph:"deixa vazio = parcelas × "+fmt(x.valor),
        hint:"Se pagou com desconto, bota o valor que pagou de verdade."},
      {k:"forma",label:"Forma de pagamento",type:"select",opts:FORMAS.filter(f=>f[0]!=="credito"),value:"pix"},
      {k:"data",label:"Data",type:"date",req:1,value:todayISO()}
    ],
    save:async v=>{
      const n=Math.max(1,Math.min(i.faltam,Math.round(v.n||1)));
      const valor=v.valor>0?v.valor:round2(n*(+x.valor||0));
      const ok=await dbSet("lanc",uid(),{mes:v.data.slice(0,7),tipo:"avulsa",desc:"Adiantamento — "+x.nome+" ("+n+" parcela"+(n>1?"s":"")+")",
        cat:x.cat||"Outros",valor,data:v.data,forma:v.forma,dividaId:x.id,adiantou:n});
      if(!ok)return false;
      const novo={...stripId(x),adiantadas:(+x.adiantadas||0)+n};
      if(validYM(x.fimMes))novo.fimMes=addMonths(x.fimMes,-n);
      const ok2=await dbSet("fixas",x.id,novo);
      if(ok2){const di=dividaInfo({...novo,id:x.id});
        toast(di&&di.faltam>0?"Adiantado ✓ — agora termina em "+ymShort(novo.fimMes):"🎉 Dívida quitada!");}
      return ok2;
    }
  });
}

function ouvirGasto(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast("Esse navegador não tem microfone pra ditado — no Android, usa o Chrome");return;}
  const r=new SR();
  r.lang="pt-BR";r.interimResults=false;r.maxAlternatives=1;
  const bt=$("#qa-mic");if(bt){bt.classList.add("ouvindo");bt.textContent="🎙️ OUVINDO…";}
  const fim=()=>{if(bt){bt.classList.remove("ouvindo");bt.textContent="🎤 FALAR";}};
  r.onresult=e=>{
    const fala=e.results[0][0].transcript;
    const g=entenderFala(fala);
    if(g.valor!=null)$("#qa-valor").value=String(g.valor.toFixed(2)).replace(".",",");
    if(g.desc)$("#qa-desc").value=g.desc;
    const sel=$("#qa-cat");if(sel&&[...sel.options].some(o=>o.value===g.cat))sel.value=g.cat;
    toast(g.valor!=null?"Entendi: "+(g.desc||"gasto")+" · "+fmt(g.valor)+" — confere e clica ADICIONAR":"Ouvi \""+fala+"\" mas não peguei o valor — digita ou fala de novo");
  };
  r.onerror=e=>{toast(e.error==="not-allowed"?"Libera o microfone pro site nas configurações do navegador":"Não ouvi direito — tenta de novo");};
  r.onend=fim;
  try{r.start();}catch(_){fim();}
}

/* ---------- 4) restaurar backup ---------- */
function restaurarBackup(){
  const inp=document.createElement("input");
  inp.type="file";inp.accept=".json,application/json";
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0];if(!f)return;
    let dados;
    try{dados=JSON.parse(await f.text());}catch(_){toast("Esse arquivo não é um backup válido");return;}
    if(!dados||(dados.app!=="bolso"&&dados.app!=="julius")){toast("Esse arquivo não é um backup do Bolso");return;}
    const linhas=[];
    for(const c of COLS)for(const x of (Array.isArray(dados[c])?dados[c]:[])){
      if(!x||!x.id)continue;
      const {id,...resto}=x;linhas.push({col:c,doc_id:String(id),data:resto});
    }
    const quando=dados.geradoEm?dBR(String(dados.geradoEm).slice(0,10)):"data desconhecida";
    openForm({
      title:"Restaurar backup",
      sub:"Backup de "+quando+" com "+linhas.length+" registro(s). O que tiver o mesmo código é substituído pelo do arquivo; nada é apagado.",
      saveLabel:"RESTAURAR",
      fields:[{k:"cfg",label:"Restaurar também as configurações (CDI, tetos, categorias)",type:"check",value:true}],
      save:async v=>{
        if(S.mem){
          for(const r of linhas){const a=S[r.col],i=a.findIndex(x=>x.id===r.doc_id),row={id:r.doc_id,...r.data};i<0?a.push(row):a[i]=row;}
          if(v.cfg&&dados.cfg)S.cfg={...S.cfg,...dados.cfg,pinHash:S.cfg.pinHash};
          renderAll();toast("Backup restaurado ✓");return true;
        }
        if(!USER)return false;
        const agora=new Date().toISOString();
        const tudo=linhas.map(r=>({user_id:USER.id,col:r.col,doc_id:r.doc_id,data:r.data,updated_at:agora}));
        for(let i=0;i<tudo.length;i+=400){
          const {error}=await sb.from("bolso_docs").upsert(tudo.slice(i,i+400));
          if(error){toast("Não restaurou: "+error.message);return false;}
        }
        if(v.cfg&&dados.cfg){
          const ok=await cfgSetFull({...S.cfg,...dados.cfg,pinHash:S.cfg.pinHash});
          if(!ok)return false;
        }
        await loadAll();
        toast("Backup restaurado ✓ ("+tudo.length+" registros)");
        return true;
      }
    });
  };
  inp.click();
}

/* =========================== estimativas inv =========================== */
function taxaAnual(i){
  if(i.pctCdi&&S.cfg.cdi)return (+S.cfg.cdi)*(+i.pctCdi)/100;
  if(i.rendPct)return +i.rendPct;
  return null;
}
function estMensal(i){
  const t=taxaAnual(i);
  if(t==null||!(i.atual>0))return null;
  return round2(i.atual*(Math.pow(1+t/100,1/12)-1));
}
function diasAte(iso){const hoje=todayISO();return Math.round((new Date(iso+"T12:00:00")-new Date(hoje+"T12:00:00"))/864e5)}
function liquidezInfo(i){
  const hoje=todayISO();
  if(i.liquidez==="apos"){
    const n=Math.max(1,Math.round(+i.mesesCarencia||6));
    if(!i.dataApl)return {txt:"Preso por "+n+" meses após a aplicação — cadastra a data da aplicação pra eu contar",cls:"warntx"};
    const lib=addMonthsDate(i.dataApl,n);
    if(lib<=hoje)return {txt:"Liberado desde "+dBR(lib)+" ("+n+" meses da aplicação) ✓",cls:"pos"};
    return {txt:"Preso até "+dBR(lib)+" ("+n+" meses da aplicação) · faltam "+diasAte(lib)+" dias",cls:"warntx"};
  }
  if(i.liquidez!=="vencimento")return {txt:"Liquidez diária — resgata quando quiser",cls:"pos"};
  if(!i.dataVenc)return {txt:"Liquidez no vencimento",cls:""};
  if(i.dataVenc<=hoje)return {txt:"Venceu em "+dBR(i.dataVenc)+" — já pode resgatar ✓",cls:"pos"};
  return {txt:"Preso até "+dBR(i.dataVenc)+" · faltam "+diasAte(i.dataVenc)+" dias",cls:"warntx"};
}

/* ----- termômetro ----- */
function termometro(mes){
  const d=monthData(mes), hoje=ymNow();
  let comp,renda;
  if(mes<hoje){comp=d.gasto;renda=d.rendReal;}
  else{comp=round2(d.fixoPrev+sum(d.faturaCartao.map(l=>l.valor))+d.futuroPrev);renda=d.rendPrev;}
  if(!(renda>0))return {pct:null,cls:"t-nd"};
  const p=comp/renda;
  return {pct:p, cls:p<0.4?"t-ok":p<0.7?"t-meio":"t-alto"};
}
function vTermo(){
  const ano=S.ano;
  let cells="";
  for(let m=1;m<=12;m++){

      +'<span class="tm">'+MESAB[m-1]+'</span><span class="num tp">'+(t.pct==null?"—":Math.round(t.pct*100)+"%")+'</span></button>';
  }
  return '<div class="card"><div class="cardhead"><h2>Termômetro do ano</h2>'
    +'<span style="flex:1"></span><button class="iconb" data-act="anoPrev" aria-label="Ano anterior">‹</button><b class="num">'+ano+'</b><button class="iconb" data-act="anoNext" aria-label="Próximo ano">›</button></div>'

function tile(lbl,val,sm,cls){return '<div class="tile"><div class="lbl">'+esc(lbl)+'</div><div class="val num '+cls+'">'+esc(val)+'</div><div class="sm">'+esc(sm)+'</div></div>'}
function chartMeses(){
  const meses=[0,1,2,3,4,5].map(i=>addMonths(S.mes,i-5));
  const dados=meses.map(m=>{const d=monthData(m);return{m,rec:d.rendReal,gua:d.guard,gas:d.gasto}});
  const max=niceMax(Math.max(...dados.map(d=>Math.max(d.rec,d.gua,d.gas)),1));
  const H=150;
  let bars="",labs="";
  for(const d of dados){
    bars+='<div class="group">'
      +barV("v1",d.rec,max,H,"Recebido · "+fmt(d.rec)+" · "+ymShort(d.m))
      +barV("v2",d.gua,max,H,"Guardado · "+fmt(d.gua)+" · "+ymShort(d.m))
      +barV("v3",d.gas,max,H,"Gasto · "+fmt(d.gas)+" · "+ymShort(d.m))
      +'</div>';
    labs+='<div style="flex:1;text-align:center" class="num">'+esc(ymShort(d.m))+'</div>';
  }
  return '<div class="card"><h2>Últimos 6 meses</h2><p class="sub">o que entrou, o que você guardou e o que saiu</p>'
    +'<div class="legend"><span><i style="background:var(--viz-verde)"></i>Recebido</span><span><i style="background:var(--viz-roxo)"></i>Guardado</span><span><i style="background:var(--viz-verm)"></i>Gasto</span></div>'
    +'<div class="chart-scroll"><div class="gchart"><div class="plot">'
    +'<div class="gl" style="top:0"><span>'+esc(fmtK(max))+'</span></div>'
    +'<div class="gl" style="top:50%"><span>'+esc(fmtK(max/2))+'</span></div>'
    +'<div class="groups">'+bars+'</div>'
    +'</div><div class="xlabels">'+labs+'</div></div></div></div>';
}
function barV(cls,v,max,H,tip){
  if(!(v>0))return '<div class="bar" style="height:0;background:transparent"></div>';
  const h=Math.max(2,Math.round(v/max*H));
  return '<div class="bar '+cls+'" style="height:'+h+'px" data-tip="'+esc(tip)+'"></div>';
}
function chartCategorias(d){
  const by={};
  for(const l of d.lan){if(l.tipo==="fixa"||l.tipo==="avulsa")by[l.cat||"Outros"]=round2((by[l.cat||"Outros"]||0)+(+l.valor||0));}
  let rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  if(rows.length>8){const resto=sum(rows.slice(7).map(r=>r[1]));rows=rows.slice(0,7);rows.push(["Outros +",resto]);}
  const max=Math.max(...rows.map(r=>r[1]),1), tot=sum(rows.map(r=>r[1]));
  let h='<div class="card"><h2>Pra onde foi o dinheiro</h2><p class="sub">gastos de '+esc(MESES[+S.mes.slice(5,7)-1])+' por categoria</p>';
  if(!rows.length)h+='<div class="empty">Nenhum gasto lançado nesse mês ainda.</div>';
  else{
    h+='<div class="hbars">';
    for(const[c,v]of rows)
      h+='<div class="hb" data-tip="'+esc(c+" · "+fmt(v)+" · "+pct(v/tot)+" do total")+'"><div class="l">'+esc(c)+'</div><div class="track"><div class="fill" style="width:'+Math.max(2,Math.round(v/max*100))+'%"></div></div><div class="v">'+esc(fmt(v))+'</div></div>';
    h+='</div>';
  }
  return h+'</div>';
}

function resultadoBusca(){
  const r=buscarLanc(S.busca,S.buscaPer);
  if(!r)return '';
  if(!r.itens.length)return '<div class="empty">Nada encontrado com "'+esc(S.busca)+'".</div>';
  const TIP={avulsa:"avulsa",fixa:"fixa",cartao:"crédito",futura:"planejada"};
  let h='<div class="banner" style="margin-top:12px">Total gasto: <b class="num">'+esc(fmt(r.total))+'</b> · '+r.itens.length+' lançamento(s)</div><div class="rows">';
  for(const l of r.itens.slice(0,100))
    h+='<div class="row"><div class="main"><div class="t">'+esc(l.desc||"Gasto")+' <span class="chip">'+esc(l.cat||"Outros")+'</span> <span class="chip">'+esc(TIP[l.tipo]||l.tipo)+'</span></div>'
      +'<div class="d">'+esc(l.data?dBR(l.data):ymShort(l.mes))+(l.obs?' · '+esc(l.obs):'')+'</div></div>'
      +'<div class="valcol"><span class="num">'+esc(fmt(l.valor))+'</span></div></div>';
  if(r.itens.length>100)h+='<p class="sub" style="margin:8px 0 0">mostrando os 100 mais recentes</p>';
  return h+'</div>';
}

/* ----- agenda (calendário do mês) ----- */
function vAgenda(){
  const a=agendaMes(S.mes), hoje=todayISO(), mesN=MESES[+S.mes.slice(5,7)-1];
  const dSel=S.diaSel&&S.diaSel.slice(0,7)===S.mes?+S.diaSel.slice(8,10):(S.mes===ymNow()?+hoje.slice(8,10):1);
  const totIn=sum(Object.values(a.dias).flat().filter(e=>e.t==="in").map(e=>e.valor));
  const totOut=sum(Object.values(a.dias).flat().filter(e=>e.t==="out").map(e=>e.valor));
  let h='<div class="card"><div class="cardhead"><h2>📅 Agenda de '+esc(mesN)+'</h2>'
    +'<span class="tot">entra <b class="num pos">'+esc(fmt(totIn))+'</b> · sai <b class="num neg">'+esc(fmt(totOut))+'</b></span></div>'
    +'<p class="sub">verde = dinheiro entrando · vermelho = conta saindo · toca no dia pra ver o que tem</p>';
  if(a.apertado.length)
    h+='<div class="banner" style="margin:0 0 10px">⚠️ Dias apertados (sai mais do que entrou até ali): <b>'+a.apertado.slice(0,8).map(d=>pad(d)).join(", ")+'</b>'
      +(a.apertado.length>8?' e mais '+(a.apertado.length-8):'')+'</div>';
  h+='<div class="cal"><div class="calh">'+["D","S","T","Q","Q","S","S"].map(x=>'<span>'+x+'</span>').join("")+'</div><div class="calg">';
  for(let i=0;i<a.primeiroSem;i++)h+='<span class="cd vazio"></span>';
  for(let dia=1;dia<=a.ultimo;dia++){
    const ev=a.dias[dia]||[], iso=S.mes+"-"+pad(dia);
    const inV=sum(ev.filter(e=>e.t==="in").map(e=>e.valor)), outV=sum(ev.filter(e=>e.t==="out").map(e=>e.valor));
    const cls=["cd"];
    if(iso===hoje)cls.push("hoje");
    if(dia===dSel)cls.push("sel");
    if(a.apertado.includes(dia))cls.push("aperto");
    if(ev.some(e=>e.atrasada))cls.push("atraso");
    h+='<button class="'+cls.join(" ")+'" data-act="diaSel" data-ym="'+iso+'"><b>'+dia+'</b>'
      +(inV?'<i class="pin">+'+esc(fmtK(inV)).replace("R$ ","")+'</i>':'')
      +(outV?'<i class="pout">−'+esc(fmtK(outV)).replace("R$ ","")+'</i>':'')+'</button>';
  }
  h+='</div></div></div>';
  const evs=(a.dias[dSel]||[]);
  h+='<div class="card"><div class="cardhead"><h2>Dia '+pad(dSel)+' de '+esc(mesN)+'</h2>'
    +'<span class="tot">saldo do mês até aqui <b class="num '+(a.saldo[dSel]<0?"neg":"pos")+'">'+esc((a.saldo[dSel]>=0?"+":"−")+" "+fmt(Math.abs(a.saldo[dSel]||0)))+'</b></span></div>';
  if(!evs.length)h+='<div class="empty">Nada nesse dia.</div>';
  else{
    h+='<div class="rows">';
    for(const e of evs)
      h+='<div class="row"><div class="main"><div class="t">'+(e.t==="in"?"💚 ":"🔻 ")+esc(e.nome)+'</div>'
        +'<div class="d">'+(e.t==="in"?(e.ok?"recebido":"previsto pra cair"):(e.ok?"pago":(e.atrasada?'<span class="neg">atrasada</span>':"vence nesse dia")))+'</div></div>'
        +'<span class="num '+(e.t==="in"?"pos":"neg")+'">'+esc((e.t==="in"?"+ ":"− ")+fmt(e.valor))+'</span></div>';
    h+='</div>';
  }
  h+='</div>';
  if(a.semDia.length){
    h+='<div class="card"><h2>Sem dia definido</h2><p class="sub">coloca o dia (✎) que eles entram no calendário</p><div class="rows">';
    for(const e of a.semDia)
      h+='<div class="row"><div class="main"><div class="t">'+(e.t==="in"?"💚 ":"🔻 ")+esc(e.nome)+'</div><div class="d">'+(e.t==="in"?"renda — sem \"dia que cai\"":"conta — sem dia de vencimento")+'</div></div>'
        +'<span class="num">'+esc(fmt(e.valor))+'</span></div>';
    h+='</div></div>';
  }
  return h;
}

function relDelta(atual,ant,antL){
  if(!atual&&!ant)return "";
  const df=round2(atual-ant);
  return " · vs "+antL+": "+(df>=0?"+":"−")+fmt(Math.abs(df));
}

  h+='<div class="card"><div class="cardhead"><h2>Despesas fixas</h2><span class="tot">pago <b class="num">'+esc(fmt(d.fixoReal))+'</b> de '+esc(fmt(d.fixoPrev))+' previsto</span></div><div class="rows">';
  for(const x of d.fixas){const l=d.pagByRef[x.id];
    h+='<div class="row"><div class="main"><div class="t">'+esc(x.nome)+'</div><div class="d">previsto '+esc(fmt(x.valor))+(l&&l.forma?' · pago no '+esc(formaLabel(l.forma)):'')+'</div></div><div class="valcol">'+(l?'<span class="num">'+esc(fmt(l.valor))+' ✓</span>':'<span class="warntx">pendente</span>')+'</div></div>';}
  if(!d.fixas.length)h+='<div class="empty">Nenhuma fixa nesse mês.</div>';
  h+='</div></div>';
  if(d.futuras.length){
    h+='<div class="card"><div class="cardhead"><h2>Planejadas (ainda não pagas)</h2><span class="tot">total <b class="num">'+esc(fmt(d.futuroPrev))+'</b></span></div><div class="rows">';
    for(const l of d.futuras.slice().sort((a,b)=>(a.data||"").localeCompare(b.data||"")))
      h+='<div class="row"><div class="main"><div class="t">'+esc(l.desc||"Planejada")+'</div><div class="d">pra '+esc(dShort(l.data))+(l.obs?' · '+esc(l.obs):'')+'</div></div><span class="num">'+esc(fmt(l.valor))+'</span></div>';
    h+='</div></div>';
  }
  const av=d.lan.filter(l=>l.tipo==="avulsa");
  const porCat={};for(const l of av){(porCat[l.cat||"Outros"]=porCat[l.cat||"Outros"]||[]).push(l);}
  const cats=Object.entries(porCat).sort((a,b)=>sum(b[1].map(l=>l.valor))-sum(a[1].map(l=>l.valor)));
  h+='<div class="card"><div class="cardhead"><h2>Gastos avulsos</h2><span class="tot">total <b class="num">'+esc(fmt(d.avulso))+'</b></span></div>';
  if(!cats.length)h+='<div class="empty">Nenhum gasto avulso nesse mês.</div>';
  for(const[c,ls]of cats){
    h+='<p class="sub" style="margin:10px 0 0">'+esc(c)+' — <b class="num">'+esc(fmt(sum(ls.map(l=>l.valor))))+'</b></p><div class="rows">';
    for(const l of ls.slice().sort((a,b)=>(a.data||"").localeCompare(b.data||"")))
      h+='<div class="row"><div class="main"><div class="t">'+esc(l.desc||"")+'</div><div class="d">'+esc(dShort(l.data))+(l.forma?' · '+esc(formaLabel(l.forma)):'')+(l.obs?' · '+esc(l.obs):'')+'</div></div><span class="num">'+esc(fmt(l.valor))+'</span></div>';
    h+='</div>';
  }
  h+='</div>';
  const proxR=addMonths(S.mes,1), dProxR=monthData(proxR);
  const baseProxR=sum(dProxR.fixas.filter(x=>x.ehCartao).map(x=>x.valor));
  const compProxR=sum(dProxR.faturaCartao.map(l=>l.valor));
  if(d.faturaCartao.length||d.comprasNovasTot>0||baseProxR+compProxR>0){
    h+='<div class="card"><h2>Cartão de crédito</h2><div class="rows">';
    for(const l of d.faturaCartao.slice().sort((a,b)=>(a.data||"").localeCompare(b.data||"")))
      h+='<div class="row"><div class="main"><div class="t">'+esc(l.desc||"Compra")+'</div><div class="d">na fatura de '+esc(ymShort(S.mes))+' · compra de '+esc(dShort(l.data))+(l.obs?' · '+esc(l.obs):'')+'</div></div><span class="num">'+esc(fmt(l.valor))+'</span></div>';
    if(d.comprasNovasTot>0)h+='<div class="row"><div class="main"><div class="t">Compras do mês → próximas faturas</div></div><span class="num">'+esc(fmt(d.comprasNovasTot))+'</span></div>';
    if(baseProxR+compProxR>0)h+='<div class="row"><div class="main"><div class="t">Próxima fatura ('+esc(ymShort(proxR))+')</div><div class="d">'+(baseProxR>0&&compProxR>0?esc(fmt(baseProxR))+' base + '+esc(fmt(compProxR))+' de compras':'')+'</div></div><span class="num">'+esc(fmt(round2(baseProxR+compProxR)))+'</span></div>';
    h+='</div></div>';
  }
  const ap=d.lan.filter(l=>l.tipo==="aporte");
  if(ap.length){
    h+='<div class="card"><div class="cardhead"><h2>Guardado</h2><span class="tot"><b class="num">'+esc(fmt(d.guard))+'</b></span></div><div class="rows">';
    for(const l of ap)h+='<div class="row"><div class="main"><div class="t">'+esc(l.desc||"Aporte")+'</div><div class="d">'+esc(dShort(l.data))+'</div></div><span class="num">'+esc(fmt(l.valor))+'</span></div>';
    h+='</div></div>';
  }
  if(S.inv.length){
    const invTot=sum(S.inv.map(i=>i.atual)),invApl=sum(S.inv.map(i=>i.aplicado));
    h+='<div class="card"><div class="cardhead"><h2>Investimentos</h2><span class="tot">total <b class="num">'+esc(fmt(invTot))+'</b> · rendimento <b class="num '+(invTot-invApl<0?"neg":"pos")+'">'+esc((invTot-invApl>=0?"+":"−")+" "+fmt(Math.abs(round2(invTot-invApl))))+'</b></span></div><div class="rows">';
    for(const i of S.inv.slice().sort((a,b)=>(+b.atual||0)-(+a.atual||0))){
      const r=round2((+i.atual||0)-(+i.aplicado||0));
      h+='<div class="row"><div class="main"><div class="t">'+esc(i.nome)+'</div><div class="d">'+esc(liquidezInfo(i).txt)+'</div></div><div class="valcol"><span class="num">'+esc(fmt(i.atual))+'</span> <span class="num '+(r<0?"neg":"pos")+'" style="font-size:12px">'+esc((r>=0?"+":"−")+fmt(Math.abs(r)))+'</span></div></div>';
    }
    h+='</div></div>';
  }
  return h;
}
function buildRelHTML(){
  const d=monthData(S.mes);
  const mesAnt=addMonths(S.mes,-1), dAnt=monthData(mesAnt), antL=ymShort(mesAnt);
  const row=(a,b,c)=>'<tr><td>'+a+'</td><td class="x">'+(b||"")+'</td><td class="v">'+c+'</td></tr>';
  let t='<h2>Resumo</h2><table>'
    +row("Recebido","previsto "+esc(fmt(d.rendPrev))+esc(relDelta(d.rendReal,dAnt.rendReal,antL)),esc(fmt(d.rendReal)))
    +row("Gasto","fixas "+esc(fmt(d.fixoReal))+" · avulsas "+esc(fmt(d.avulso))+esc(relDelta(d.gasto,dAnt.gasto,antL)),esc(fmt(d.gasto)))
    +row("Guardado",(d.rendReal>0?esc(pct(d.guard/d.rendReal))+" do recebido":"aportes")+esc(relDelta(d.guard,dAnt.guard,antL)),esc(fmt(d.guard)))
    +row("<b>Sobrou</b>","recebido − gasto − guardado"+esc(relDelta(d.saldo,dAnt.saldo,antL)),"<b>"+esc(fmt(d.saldo))+"</b>")+'</table>';
  t+='<h2>Rendas</h2><table>';
  for(const f of d.fontes){const l=d.recByRef[f.id];t+=row(esc(f.nome),"previsto "+esc(fmt(fontePrev(f))),l?esc(fmt(l.valor)):"não caiu");}
  for(const l of d.lan.filter(x=>x.tipo==="renda"&&!x.refId))t+=row(esc(l.desc||"Renda")+" (extra)",esc(dShort(l.data)),esc(fmt(l.valor)));
  t+='</table><h2>Despesas fixas</h2><table>';
  for(const x of d.fixas){const l=d.pagByRef[x.id];t+=row(esc(x.nome),"previsto "+esc(fmt(x.valor))+(l&&l.forma?" · pago no "+esc(formaLabel(l.forma)):""),l?esc(fmt(l.valor)):"pendente");}
  t+='</table>';
  if(d.futuras.length){
    t+='<h2>Planejadas (ainda não pagas) — '+esc(fmt(d.futuroPrev))+'</h2><table>';
    for(const l of d.futuras.slice().sort((a,b)=>(a.data||"").localeCompare(b.data||"")))t+=row(esc(l.desc||"Planejada"),"pra "+esc(dShort(l.data))+(l.obs?" · "+esc(l.obs):""),esc(fmt(l.valor)));
    t+='</table>';
  }
  const av=d.lan.filter(l=>l.tipo==="avulsa");
  const porCat={};for(const l of av){(porCat[l.cat||"Outros"]=porCat[l.cat||"Outros"]||[]).push(l);}
  t+='<h2>Gastos avulsos — '+esc(fmt(d.avulso))+'</h2>';
  for(const[c,ls]of Object.entries(porCat).sort((a,b)=>sum(b[1].map(l=>l.valor))-sum(a[1].map(l=>l.valor)))){
    t+='<h3>'+esc(c)+' — '+esc(fmt(sum(ls.map(l=>l.valor))))+'</h3><table>';
    for(const l of ls.slice().sort((a,b)=>(a.data||"").localeCompare(b.data||"")))t+=row(esc(l.desc||""),esc(dShort(l.data))+(l.forma?" · "+esc(formaLabel(l.forma)):"")+(l.obs?" · "+esc(l.obs):""),esc(fmt(l.valor)));
    t+='</table>';
  }
  const proxB=addMonths(S.mes,1), dProxB=monthData(proxB);
  const baseProxB=sum(dProxB.fixas.filter(x=>x.ehCartao).map(x=>x.valor));
  const compProxB=sum(dProxB.faturaCartao.map(l=>l.valor));
  if(d.faturaCartao.length||d.comprasNovasTot>0||baseProxB+compProxB>0){
    t+='<h2>Cartão de crédito</h2><table>';
    for(const l of d.faturaCartao.slice().sort((a,b)=>(a.data||"").localeCompare(b.data||"")))
      t+=row(esc(l.desc||"Compra"),"na fatura do mês · compra de "+esc(dShort(l.data))+(l.obs?" · "+esc(l.obs):""),esc(fmt(l.valor)));
    if(d.comprasNovasTot>0)t+=row("Compras do mês → próximas faturas","",esc(fmt(d.comprasNovasTot)));
    if(baseProxB+compProxB>0)t+=row("Próxima fatura ("+esc(ymShort(proxB))+")",(baseProxB>0&&compProxB>0?esc(fmt(baseProxB))+" base + "+esc(fmt(compProxB))+" de compras":""),esc(fmt(round2(baseProxB+compProxB))));
    t+='</table>';
  }
  const ap=d.lan.filter(l=>l.tipo==="aporte");
  if(ap.length){t+='<h2>Guardado — '+esc(fmt(d.guard))+'</h2><table>';for(const l of ap)t+=row(esc(l.desc||"Aporte"),esc(dShort(l.data)),esc(fmt(l.valor)));t+='</table>';}
  if(S.inv.length){
    const invTot=sum(S.inv.map(i=>i.atual)),invApl=sum(S.inv.map(i=>i.aplicado));
    t+='<h2>Investimentos — '+esc(fmt(invTot))+'</h2><table>';
    for(const i of S.inv.slice().sort((a,b)=>(+b.atual||0)-(+a.atual||0))){
      const r=round2((+i.atual||0)-(+i.aplicado||0));
      t+=row(esc(i.nome),esc(liquidezInfo(i).txt),esc(fmt(i.atual))+" ("+(r>=0?"+":"−")+esc(fmt(Math.abs(r)))+")");
    }
    t+=row("<b>Total</b>","aplicado "+esc(fmt(invApl)),"<b>"+esc(fmt(invTot))+"</b>")+'</table>';
  }
  return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bolso — '+esc(ymLabel(S.mes))+'</title><style>body{font-family:system-ui,-apple-system,sans-serif;max-width:720px;margin:24px auto;padding:0 16px;color:#171B2C;background:#fff}h1{font-size:21px}h2{font-size:15px;margin:22px 0 6px;border-bottom:2px solid #8B7CF8;padding-bottom:3px}h3{font-size:13px;margin:14px 0 4px;color:#454A63}table{width:100%;border-collapse:collapse;font-size:13.5px}td{padding:5px 6px;border-bottom:1px solid #E5E7F2;vertical-align:top}td.x{color:#767C97;font-size:12px}td.v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}p.meta{color:#767C97;font-size:12px}</style></head><body><h1>Bolso · relatório de '+esc(ymLabel(S.mes))+'</h1><p class="meta">gerado em '+esc(dBR(todayISO()))+'</p>'+t+'</body></html>';
}
function baixarBackup(){
  const {pinHash,...cfgSemPin}=S.cfg||{};          // o PIN não vai pro arquivo
  const dados={app:"bolso",versao:1,geradoEm:new Date().toISOString(),
    conta:USER?USER.email:null,cfg:cfgSemPin};
  let total=0;
  for(const c of COLS){dados[c]=S[c].map(x=>({...x}));total+=S[c].length;}
  const blob=new Blob([JSON.stringify(dados,null,2)],{type:"application/json"});
  const u=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=u;a.download="bolso-backup-"+todayISO()+".json";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
  toast("Backup baixado ✓ ("+total+" registros) — guarda num lugar seguro");
}
async function baixarRel(){
  const was=S.hide;S.hide=false;let html;
  try{html=buildRelHTML();}finally{S.hide=was;}
  const blob=new Blob([html],{type:"text/html"});
  const u=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=u;a.download="bolso-relatorio-"+S.mes+".html";
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
  toast("Relatório baixado ✓ (abre no navegador e imprime se quiser)");
}

/* ============================== tooltip ============================== */
document.addEventListener("pointerover",e=>{
  const el=e.target.closest("[data-tip]");const tip=$("#tip");
  if(!el){tip.style.display="none";return;}
  tip.textContent=el.dataset.tip;tip.style.display="block";
});
document.addEventListener("pointermove",e=>{
  const tip=$("#tip");if(tip.style.display==="none")return;
  const w=tip.offsetWidth,h=tip.offsetHeight;
  tip.style.left=Math.min(window.innerWidth-w-8,Math.max(8,e.clientX+12))+"px";
  tip.style.top=Math.max(8,(e.clientY-h-12<8?e.clientY+16:e.clientY-h-12))+"px";
});
document.addEventListener("pointerout",e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest("[data-tip]"))$("#tip").style.display="none"});

/* ============================== boot ============================== */
$("#tabs").addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(!t)return;
  S.tab=t.dataset.tab;renderAll();
  try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({tab:S.tab,mes:S.mes}));}catch(_){}
});
$("#mprev").onclick=()=>{S.mes=addMonths(S.mes,-1);renderAll();};
$("#mnext").onclick=()=>{S.mes=addMonths(S.mes,1);renderAll();};
$("#mhoje").onclick=()=>{S.mes=ymNow();renderAll();};
$("#fab").onclick=()=>gastoDialog();
$("#eye").onclick=()=>{S.hide=!S.hide;lsSet("bolso-hide",S.hide?"1":null);renderAll();};
$("#lockbtn").onclick=()=>lockCfgDialog();
document.querySelector("#lock form").addEventListener("submit",e=>{e.preventDefault();tryUnlock();});
document.querySelector("#auth form").addEventListener("submit",e=>{e.preventDefault();entrar(false);});
$("#btn-criar").onclick=()=>entrar(true);
$("#btn-esqueci").onclick=e=>{e.preventDefault();esqueciSenha();};
$("#btn-sair").onclick=()=>sair();

/* offline: guarda o app no aparelho e avisa quando a conexão cai/volta */
if("serviceWorker" in navigator&&location.protocol==="https:"){
  window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
}
window.addEventListener("offline",()=>toast("Sem internet — o que tu lançar agora pode não salvar"));
window.addEventListener("online",()=>{toast("Internet voltou ✓");if(sb&&USER&&!S.mem)loadAll();});

function start(hot){
  if(hot&&typeof hot.tab==="string"&&["resumo","rendas","despesas","agenda","corridas","inv","relatorio"].includes(hot.tab))S.tab=hot.tab;
  if(hot&&validYM(hot.mes))S.mes=hot.mes;
  if(location.hash==="#gasto")S.tab="despesas";
  if(lsGet("bolso-haspin")==="1"&&ssGet("bolso-unlock")!=="1")showLock();
  renderAll();
  connect();
  if(location.hash==="#gasto")setTimeout(()=>{if(S.locked)S.pendGasto=1;else gastoDialog();},120);
}
try{
  if(window.claude&&window.claude.hot&&typeof window.claude.hot.ready==="function")window.claude.hot.ready(start);
  else start((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
}catch(_){start({});}

/* modo memória: ajuda pra testar localmente */
window.__mem={
  seed(d){for(const c of COLS)if(d[c])S[c]=d[c];if(d.cfg)S.cfg=d.cfg;S.conectando=false;S.mem=true;renderAll();}
};
